<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ArborData - Prédiction des Clusters</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet" />
    <link href="css/app.css" rel="stylesheet" />
    <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
</head>

<body>
    <div class="site-shell">
        <header class="topbar">
            <div class="brand">ArborData</div>
            <nav class="nav">
                <a href="index.html">Accueil</a>
                <a href="add.html">Ajouter un arbre</a>
                <a href="map.html">Visualisation</a>
                <a class="active" href="IACluster.html">Clusters IA</a>
                <a href="IARisque.html">Age/Risque IA</a>
            </nav>
        </header>
        <main class="cluster-page">
            <section class="panel">
                <h1 class="page-title">Prédiction des Clusters IA</h1>
                <p class="page-subtitle">Classification K-Means des arbres par taille (Petit/Moyen/Grand)</p>
                <a class="btn btn-primary back-link" href="map.html">Retour a la visualisation</a>
            </section>

            <section class="panel cluster-info" id="cluster-stats">
                <div id="loading">Chargement des prédictions...</div>
            </section>

            <section class="panel">
                <div id="cluster-map-plot" class="cluster-map"></div>
            </section>

            <section class="panel">
                <div class="table-wrap">
                    <table class="cluster-table">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Espèce</th>
                                <th>Quartier</th>
                                <th>Hauteur (m)</th>
                                <th>Diamètre (cm)</th>
                                <th>Cluster</th>
                                <th>Latitude</th>
                                <th>Longitude</th>
                            </tr>
                        </thead>
                        <tbody id="cluster-table-body"></tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>

    <script defer src="js/api.js"></script>
    <script defer src="js/cluster-page.js"></script>
</body>
</html>
