<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ArborData - Ajouter un arbre</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet" />
  <link href="css/app.css" rel="stylesheet" />
</head>
<body>
  <div class="site-shell">
    <header class="topbar">
      <div class="brand">arborData saint-quentin</div>
      <nav class="nav">
        <a href="index.html">accueil</a>
        <a class="active" href="add.html">ajouter un arbre</a>
        <a href="map.html">visualisation</a>
      </nav>
    </header>

    <main>
      <h1 class="page-title">ajout d'un nouvel arbre</h1>
      <p class="page-subtitle">formulaire connecte a l'api. les champs age et deracinement ne sont pas demandes.</p>

      <form class="panel add-tree-form" style="margin-top:16px; display:grid; gap:14px;">
        <section class="grid" style="grid-template-columns: repeat(auto-fit, minmax(220px,1fr));">
          <div class="field">
            <label for="species">espece</label>
            <select id="species" required>
              <option value="">selectionner une espece</option>
            </select>
          </div>
          <div class="field">
            <label for="type">type / feuillage</label>
            <select id="type" required>
              <option value="">selectionner un type</option>
            </select>
          </div>
          <div class="field">
            <label for="etat">etat</label>
            <select id="etat" required>
              <option value="">selectionner un etat</option>
            </select>
          </div>
          <div class="field">
            <label for="development_stage">stade de developpement</label>
            <select id="development_stage" required>
              <option value="">selectionner un stade</option>
            </select>
          </div>
          <div class="field">
            <label for="crown_type">type de port</label>
            <select id="crown_type" required>
              <option value="">selectionner un port</option>
            </select>
          </div>
          <div class="field">
            <label for="base_type">type de pied</label>
            <select id="base_type" required>
              <option value="">selectionner un pied</option>
            </select>
          </div>
          <div class="field">
            <label for="total_height">hauteur totale (m)</label>
            <input id="total_height" type="number" step="0.1" min="0" required />
          </div>
          <div class="field">
            <label for="trunk_height">hauteur tronc (m)</label>
            <input id="trunk_height" type="number" step="0.1" min="0" required />
          </div>
          <div class="field">
            <label for="diameter">diametre tronc (cm)</label>
            <input id="diameter" type="number" step="0.1" min="0" required />
          </div>
          <div class="field">
            <label for="latitude">latitude</label>
            <input id="latitude" type="number" step="0.000001" required />
          </div>
          <div class="field">
            <label for="longitude">longitude</label>
            <input id="longitude" type="number" step="0.000001" required />
          </div>
          <div class="field">
            <label for="quartier">quartier</label>
            <input id="quartier" type="text" placeholder="ex: quartier du centre-ville" required />
          </div>
          <div class="field">
            <label for="secteur">secteur</label>
            <input id="secteur" type="text" placeholder="ex: boulevard richelieu" required />
          </div>
          <div class="field">
            <label for="situation">situation</label>
            <select id="situation" required>
              <option value="">selectionner une situation</option>
            </select>
          </div>
        </section>

        <label style="display:flex; align-items:center; gap:8px; font-weight:600;">
          <input id="remarkable" type="checkbox" /> arbre remarquable
        </label>

        <div style="display:flex; gap:10px; flex-wrap:wrap;">
          <button class="btn btn-primary" type="submit">enregistrer l'arbre</button>
          <a class="btn btn-soft" href="map.html">aller a la visualisation</a>
        </div>

        <div id="form-feedback" class="feedback" aria-live="polite"></div>
      </form>
    </main>
  </div>

  <script defer src="js/add-tree.js"></script>
</body>
</html>
