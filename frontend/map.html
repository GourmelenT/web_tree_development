<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ArborData - Visualisation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet" />
  <link href="css/app.css" rel="stylesheet" />
  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
</head>
<body>
  <div class="site-shell">
    <header class="topbar">
      <div class="brand">arborData saint-quentin</div>
      <nav class="nav">
        <a href="index.html">accueil</a>
        <a href="add.html">ajouter un arbre</a>
        <a class="active" href="map.html">visualisation</a>
      </nav>
    </header>

    <main class="grid" style="margin-top:16px;">
      <section class="panel" style="display:grid; gap:12px;">
        <h1 class="page-title" style="margin:0;">visualisation des arbres</h1>
        <p class="page-subtitle">tableau + carte plotly relies a la base de donnees.</p>

        <div class="grid" style="grid-template-columns: repeat(auto-fit, minmax(220px,1fr));">
          <div class="field">
            <label for="filter-search">rechercher une espece</label>
            <input id="filter-search" type="text" placeholder="ex: quercus" />
          </div>
          <div class="field">
            <label for="filter-etat">filtrer par etat</label>
            <select id="filter-etat">
              <option value="">tous les etats</option>
            </select>
          </div>
          <div class="field" style="align-self:end;">
            <button id="btn-refresh" class="btn btn-primary" type="button">rafraichir les donnees</button>
          </div>
          <div class="field" style="align-self:end;">
            <a href="IACluster.html" class="btn btn-primary" style="text-decoration: none; text-align: center;">🎯 clusters IA</a>
          </div>
          <div class="field" style="align-self:end;">
            <a href="IARisque.html" class="btn btn-primary" style="text-decoration: none; text-align: center;">⚠️ age/risque IA</a>
          </div>
        </div>

        <p id="map-status" class="page-subtitle">chargement...</p>
        <p id="arbres-count" class="page-subtitle"></p>
      </section>

      <section class="panel">
        <div id="arbres-map-plot" style="height:480px;"></div>
      </section>

      <section class="panel">
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>id</th>
                <th>espece</th>
                <th>quartier</th>
                <th>type</th>
                <th>h totale</th>
                <th>h tronc</th>
                <th>diametre</th>
                <th>remarquable</th>
                <th>latitude</th>
                <th>longitude</th>
                <th>etat</th>
                <th>stade</th>
                <th>port</th>
                <th>pied</th>
                <th>age</th>
              </tr>
            </thead>
            <tbody id="arbres-body"></tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  <script defer src="js/map-page.js"></script>
</body>
</html>
